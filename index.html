<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hassium — Mathematics &amp; LaTeX</title>
    <meta name="description" content="Hassium's personal website: notes on mathematics, a LaTeX style, and a few other things.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem("hassium-theme");
                if (theme !== "light" && theme !== "dark") {
                    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }
                document.documentElement.setAttribute("data-theme", theme);
            } catch (error) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
    <link rel="preload" href="assets/fonts/pagella-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <div class="container header-inner">

                <img class="brand-image" src="assets/knot-8_6.png" alt="" width="480" height="382">
            </a>

                <a href="latex/">LaTeX</a>
                <a href="math/">Math</a>
                <a href="football/">Football</a>
                <a href="others/">Others</a>
            </nav>
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false">

            </div>

        <div class="container footer-inner">
